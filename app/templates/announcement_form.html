{% extends "base.html" %}

{% block title %}Announcement - NBM Academia{% endblock %}

{% block content %}
<h2 class="page-title">{{ 'Edit' if announcement else 'Add' }} an announcement</h2>

<form method="post" class="card" style="max-width: 600px;">
  <label for="title">Title</label>
  <input type="text" id="title" name="title" required
         value="{{ announcement[1] if announcement else '' }}">

  <label for="content">Content</label>
  <textarea id="content" name="content" rows="6" required>{{ announcement[2] if announcement else '' }}</textarea>

  <button type="submit">Save</button>
</form>
{% endblock %}
