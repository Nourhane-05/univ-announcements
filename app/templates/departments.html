{% extends "base.html" %}

{% block title %}Departments - NBM Academia{% endblock %}

{% block content %}
<h2 class="page-title">Our Departments</h2>
<p class="lead">The academic departments of NBM Academia.</p>

<div class="grid">
  {% for d in rows %}
  <div class="card">
    <h3>{{ d[0] }}</h3>
    <p>{{ d[1] }}</p>
  </div>
  {% else %}
  <p>No departments yet.</p>
  {% endfor %}
</div>
{% endblock %}
